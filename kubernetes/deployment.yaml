apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-task5
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-task5
  template:
    metadata:
      labels:
        app: devops-task5
    spec:
      containers:
        - name: web
          image: devops-task3:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 80